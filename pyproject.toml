[project]
name = "dogsapka-ai-clipper"
version = "0.1.0"
description = "AI-powered Twitch highlight detection and automatic short-form video editor"
requires-python = ">=3.11"
readme = "README.md"

[project.scripts]
dogsapka-ai-clipper = "dogsapka_clipper.app:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
