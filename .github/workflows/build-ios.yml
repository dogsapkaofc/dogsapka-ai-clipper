name: iOS remote app

# Builds the DOGSAPKA iPhone remote-control app on a GitHub-hosted Mac and runs its unit tests in the
# iOS Simulator. With the App Store Connect secrets configured (see ios/README.md), "TestFlight" also signs
# the app and uploads it to TestFlight - for tags "ios-v*" or when started by hand with testflight = true.
on:
  push:
    branches: [main]
    paths: ["ios/**", ".github/workflows/build-ios.yml"]
    tags: ["ios-v*"]
  workflow_dispatch:
    inputs:
      testflight:
        description: "Upload to TestFlight (needs the Apple secrets)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-and-test:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: |
          brew install xcodegen
          xcodebuild -version
      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate
      - name: Pick a simulator
        id: sim
        run: |
          SIM=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devs = json.load(sys.stdin)["devices"]
          ios = sorted((k for k in devs if "iOS" in k), key=lambda k: [int(x) for x in k.split("iOS-")[-1].split("-")])
          for rt in reversed(ios):
              for d in devs[rt]:
                  if d["name"].startswith("iPhone"):
                      print(d["udid"]); raise SystemExit
          ')
          echo "Using simulator $SIM"
          echo "id=$SIM" >> "$GITHUB_OUTPUT"
      - name: Build and test
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild test -project DogsapkaRemote.xcodeproj -scheme DogsapkaRemote \
            -destination "id=${{ steps.sim.outputs.id }}" CODE_SIGNING_ALLOWED=NO | tail -80
      - name: Unsigned IPA (for sideloading with Sideloadly / AltStore)
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild build -project DogsapkaRemote.xcodeproj -scheme DogsapkaRemote -configuration Release \
            -destination "generic/platform=iOS" -derivedDataPath build/dd \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" | tail -20
          APP=$(find build/dd/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -1)
          rm -rf build/ipa && mkdir -p build/ipa/Payload
          cp -R "$APP" build/ipa/Payload/
          VERSION=$(/usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" "$APP/Info.plist")
          (cd build/ipa && zip -qry "../DOGSAPKA_Remote_${VERSION}_unsigned.ipa" Payload)
          ls -la build/*.ipa
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: DOGSAPKA-iOS-unsigned-ipa
          path: ios/build/*.ipa
          retention-days: 30
      - name: Attach IPA to the release
        if: startsWith(github.ref, 'refs/tags/ios-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 || gh release create "${GITHUB_REF_NAME}" \
            --title "DOGSAPKA iPhone app ${GITHUB_REF_NAME#ios-v}" --latest=false \
            --notes "iPhone távirányító - telepítés: ios/README.md"
          gh release upload "${GITHUB_REF_NAME}" ios/build/*.ipa --clobber

  testflight:
    needs: build-and-test
    # only on request (Actions → Run workflow → "Upload to TestFlight"); tags just build the sideloadable IPA
    if: github.event_name == 'workflow_dispatch' && inputs.testflight
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Check secrets
        run: |
          if [ -z "$TEAM_ID" ] || [ -z "$ASC_KEY_ID" ] || [ -z "$ASC_ISSUER_ID" ] || [ -z "$ASC_PRIVATE_KEY" ]; then
            echo "::error::Apple secrets are missing - see ios/README.md (APPLE_TEAM_ID, ASC_KEY_ID, ASC_ISSUER_ID, ASC_PRIVATE_KEY)."
            exit 1
          fi
      - name: App Store Connect API key
        run: |
          mkdir -p ~/private_keys
          printf '%s' "$ASC_PRIVATE_KEY" > ~/private_keys/AuthKey_$ASC_KEY_ID.p8
      - name: Generate Xcode project
        working-directory: ios
        run: |
          brew install xcodegen
          DEVELOPMENT_TEAM="$TEAM_ID" xcodegen generate
      - name: Archive (automatic signing via the API key)
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild archive -project DogsapkaRemote.xcodeproj -scheme DogsapkaRemote \
            -destination "generic/platform=iOS" -archivePath build/DogsapkaRemote.xcarchive \
            DEVELOPMENT_TEAM="$TEAM_ID" CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_$ASC_KEY_ID.p8 \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" | tail -60
      - name: Upload to TestFlight
        working-directory: ios
        run: |
          cat > build/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          EOF
          set -o pipefail
          xcodebuild -exportArchive -archivePath build/DogsapkaRemote.xcarchive \
            -exportOptionsPlist build/ExportOptions.plist -exportPath build/export \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_$ASC_KEY_ID.p8 \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" | tail -40
          echo "Uploaded build ${{ github.run_number }} - it appears in TestFlight after Apple's processing (5-30 min)."
